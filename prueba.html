<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Cuenta regresiva 31 de mayo 2025 - 12:00 PM</title>
    <style>
        body {
            background-color: #fdfdfd;
            font-family: 'Segoe UI', sans-serif;
            text-align: center;
            padding-top: 50px;
        }

        h1 {
            color: #e84e1b;
            font-size: 2em;
        }

        #contador {
            font-size: 2em;
            color: #009540;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <h1>Cuenta regresiva al 31 de mayo de 2025 - 12:00 PM</h1>
    <div id="contador">Cargando...</div>

    <script>
        function actualizarCuenta() {
            const destino = new Date("2025-05-31T12:00:00").getTime();
            const ahora = new Date().getTime();
            const diferencia = destino - ahora;

            if (diferencia <= 0) {
                document.getElementById("contador").innerText = "¡Ya es 31 de mayo de 2025 a las 12:00 PM!";
                return;
            }

            const dias = Math.floor(diferencia / (1000 * 60 * 60 * 24));
            const horas = Math.floor((diferencia % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutos = Math.floor((diferencia % (1000 * 60 * 60)) / (1000 * 60));
            const segundos = Math.floor((diferencia % (1000 * 60)) / 1000);

            document.getElementById("contador").innerText =
                `${dias} días, ${horas} horas, ${minutos} minutos y ${segundos} segundos`;
        }

        setInterval(actualizarCuenta, 1000);
        actualizarCuenta();
    </script>
</body>

</html>
